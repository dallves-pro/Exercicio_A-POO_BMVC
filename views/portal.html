<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal BMVC - Login</title>
</head>
<body>
    <h2>Bem-vindo ao "Gerenciador de Finanças Pessoais"</h2>
    <form action="/portal" method="POST">
        <label>Usuário:</label><br>
        <input type="text" name="username" required><br><br>
        
        <label>Senha:</label><br>
        <input type="password" name="password" required><br><br>
        
        <button type="submit">Entrar no Banco</button>
    </form>
</body>
</html>
